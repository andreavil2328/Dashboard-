<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f7f4ed"><title>Morning Ritual</title><style>
*{box-sizing:border-box}body{margin:0;background:#f7f4ed;color:#28382e;font:16px -apple-system,BlinkMacSystemFont,Arial,sans-serif}main{max-width:520px;margin:auto;padding:40px 22px}small{letter-spacing:2px;text-transform:uppercase;color:#637467}h1{font:46px Georgia,serif;margin:12px 0}p{line-height:1.5;color:#59665c}.card{background:#fffdf8;border:1px solid #e0e3d8;border-radius:22px;padding:22px;margin:16px 0}h2{font:26px Georgia,serif;margin:8px 0}.top{display:flex;justify-content:space-between;align-items:center}.count{font-size:28px;font-weight:600}.track{height:9px;background:#e5e9df;border-radius:9px;overflow:hidden;margin:16px 0}.fill{height:100%;background:#69866b;border-radius:9px;transition:width .2s}button{width:100%;min-height:52px;border:0;border-radius:13px;background:#344f3b;color:white;font:600 16px inherit;font-size:16px;font-weight:600;cursor:pointer}button:disabled{background:#e4eade;color:#425747;cursor:default}footer{text-align:center;font-size:13px;color:#637467;margin-top:28px}.emoji{font-size:30px}#notice{color:#8b442b}button:focus-visible{outline:3px solid #aa8654;outline-offset:3px}</style></head><body><main><small>Small steps · Every week</small><h1>Morning ritual.</h1><p>A little movement. A little mindfulness.<br>Make time for yourself today.</p><p id="date"></p><section class="card"><div class="top"><span class="emoji" aria-hidden="true">☀️</span><span class="count" id="walkCount"></span></div><h2>Morning walk</h2><p>15 minutes of movement</p><div class="track" role="progressbar" aria-label="Walking goal" aria-valuemin="0" aria-valuemax="3" id="walkBar"><div class="fill" id="walkFill"></div></div><p id="walkLeft"></p><button id="walkButton">Log my walk</button></section><section class="card"><div class="top"><span class="emoji" aria-hidden="true">📖</span><span class="count" id="readCount"></span></div><h2>Morning reading</h2><p>10 minutes of reading</p><div class="track" role="progressbar" aria-label="Reading goal" aria-valuemin="0" aria-valuemax="3" id="readBar"><div class="fill" id="readFill"></div></div><p id="readLeft"></p><button id="readButton">Log my reading</button></section><p id="notice" role="status"></p><footer>Consistency over perfection.<br>Weekly goals reset every Monday.</footer></main><script>
const key='morning-ritual-v1', $=id=>document.getElementById(id);let data={walk:[],read:[]};function load(){try{const s=JSON.parse(localStorage.getItem(key));if(s&&Array.isArray(s.walk)&&Array.isArray(s.read))data=s;}catch(e){$('notice').textContent='Browser storage is unavailable. Progress may not survive closing this page.';}}function day(d){return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}function render(){const now=new Date(),today=day(now),mon=new Date(now.getFullYear(),now.getMonth(),now.getDate());mon.setDate(mon.getDate()-(mon.getDay()+6)%7);const sun=new Date(mon);sun.setDate(sun.getDate()+6);const fmt=d=>d.toLocaleDateString(undefined,{month:'short',day:'numeric'});$('date').textContent='Week of '+fmt(mon)+' – '+fmt(sun);for(const h of ['walk','read']){const n=new Set(data[h].filter(d=>d>=day(mon)&&d<=today)).size,left=Math.max(0,3-n),done=data[h].includes(today);$(h+'Count').textContent=n+' / 3';$(h+'Fill').style.width=Math.min(n/3*100,100)+'%';$(h+'Bar').setAttribute('aria-valuenow',Math.min(n,3));$(h+'Left').textContent=left?left+' session'+(left===1?'':'s')+' left this week':'Weekly goal achieved!';$(h+'Button').disabled=done;$(h+'Button').textContent=done?'✓ Completed today':h==='walk'?'Log my walk':'Log my reading';}}function log(h){load();const today=day(new Date());if(!data[h].includes(today)){data[h].push(today);try{localStorage.setItem(key,JSON.stringify(data));}catch(e){$('notice').textContent='Progress could not be saved permanently in this browser.';}}render();}for(const h of ['walk','read'])$(h+'Button').addEventListener('click',()=>log(h));load();render();window.addEventListener('focus',()=>{load();render()});window.addEventListener('storage',()=>{load();render()});document.addEventListener('visibilitychange',()=>{if(!document.hidden){load();render()}});setInterval(render,30000);
</script></body></html>
